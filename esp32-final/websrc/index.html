<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32 Smart Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ESP32 Upravljačka ploča</h1>
    <nav>
      <button id="tab-home" class="tab active">Upravljačka ploča</button>
      <button id="tab-events" class="tab">Događaji</button>
    </nav>
  </header>
  <main>
    <section id="view-home">
      <div class="container">
        <div class="row">
          <div class="card" id="sys-info"></div>
          <div class="card" id="event-summary"></div>
        </div>
        <h2>Svjetla</h2>
        <div class="grid" id="lights"></div>
        <h2>Utičnice</h2>
        <div class="grid" id="outlets"></div>
      </div>
    </section>
    <section id="view-events" class="hidden">
      <div class="container">
        <div class="row">
          <div class="card">
            <label>Filter:</label>
            <input id="filter-search" placeholder="Pretraga...">
            <select id="filter-type"><option value="">Tip</option></select>
            <select id="filter-severity"><option value="">Stupanj</option></select>
            <input id="filter-after" type="date">
            <input id="filter-before" type="date">
            <button id="btn-live">Live</button>
            <button id="btn-utc">UTC</button>
            <button id="btn-export-json">JSON</button>
            <button id="btn-export-csv">CSV</button>
          </div>
        </div>
        <div class="row">
          <div class="card timeline" id="timeline">
            <div id="tl-list"></div>
          </div>
          <div class="card" id="detail"></div>
          <div class="card" id="devices"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <span id="fw-version"></span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
