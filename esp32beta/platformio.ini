[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
  bblanchon/ArduinoJson @ ^7
  ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
  knolleary/PubSubClient @ ^2.8

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DASYNCWEBSERVER_REGEX

# Disable filesystem since we don't need SPIFFS
board_build.filesystem = none

# Note: ESP32 has built-in Ethernet support
# For W5500 Ethernet module, you may need to add:
# -DW5500_ETHERNET
# And connect W5500 to VSPI pins (CS=5, RST=4, SCK=18, MISO=19, MOSI=23)